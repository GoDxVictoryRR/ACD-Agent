services:
  falkordb:
    image: falkordb/falkordb-server:latest
    container_name: falkordb-server
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: falkordb-browser
    ports:
      - "3001:3000"
    environment:
      - FALKORDB_URL=redis://falkordb:6379
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ownership-lens-app
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - GRAPH_NAME=ownership
      - DATA_SOURCE=icij
      - NVIDIA_MODEL=nvidia/nemotron-3-super-120b-a12b
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3000,http://localhost:3001
    env_file:
      - .env
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ./web:/app/web
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  falkordb_data:
