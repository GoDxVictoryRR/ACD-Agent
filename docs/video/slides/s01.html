<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ownership Lens: Who is really behind a company?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070a12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .background-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(14, 165, 233, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      z-index: 2;
    }
    .hero-subtitle {
      font-size: 1.65rem;
      font-weight: 500;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 3.5rem;
      z-index: 2;
    }
    /* Animated Chain Container */
    .chain-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInChain 1s cubic-bezier(0.16, 1, 0.3, 1) 8s forwards;
    }
    @keyframes fadeInChain {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .node-pill {
      padding: 0.85rem 1.6rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .node-company {
      background: rgba(14, 165, 233, 0.15);
      border: 2px solid #0ea5e9;
      color: #38bdf8;
    }
    .node-director {
      background: rgba(168, 85, 247, 0.15);
      border: 2px solid #a855f7;
      color: #c084fc;
    }
    .node-hidden {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid #ef4444;
      color: #f87171;
    }
    .arrow {
      color: #64748b;
      font-size: 1.5rem;
      font-weight: 800;
    }
    /* Depth 1 bracket overlay */
    .bracket-wrapper {
      position: absolute;
      top: -3.8rem;
      left: 10px;
      width: 320px;
      text-align: center;
      opacity: 0;
      animation: fadeInBracket 0.8s ease 9.5s forwards;
    }
    @keyframes fadeInBracket {
      to { opacity: 1; }
    }
    .bracket-line {
      border: 2px dashed #f59e0b;
      border-bottom: none;
      height: 18px;
      border-radius: 6px 6px 0 0;
      margin-bottom: 0.35rem;
    }
    .bracket-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .footer-note {
      position: absolute;
      bottom: 2.5rem;
      color: #475569;
      font-size: 0.95rem;
      text-align: center;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>

  <div class="hero-title">Ownership Lens</div>
  <div class="hero-subtitle">Who is really behind a company?</div>

  <div class="chain-container">
    <!-- Depth 1 bracket -->
    <div class="bracket-wrapper">
      <span class="bracket-label">Standard compliance check stops here</span>
      <div class="bracket-line"></div>
    </div>

    <div class="node-pill node-company">Company A</div>
    <div class="arrow">&rarr;</div>
    <div class="node-pill node-director">Director 1</div>
    <div class="arrow">&rarr;</div>
    <div class="node-pill node-company">Intermediary B</div>
    <div class="arrow">&rarr;</div>
    <div class="node-pill node-director">Director 2</div>
    <div class="arrow">&rarr;</div>
    <div class="node-pill node-hidden">Ultimate Beneficial Owner</div>
  </div>

  <div class="footer-note">FalkorDB Graph Hacks 2026 &bull; Track 01: Agents That Act on Connected Data</div>
</body>
</html>
